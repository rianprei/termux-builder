name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package (non-editable, matches install.sh)
        run: pip install .
      - name: Syntax check all builder modules
        run: |
          for f in builder/*.py; do
            python3 -m py_compile "$f" || exit 1
          done
      - name: CLI smoke test (--version, --help, doctor)
        run: |
          termux-builder --version
          termux-builder --help
          termux-builder doctor || true
      - name: Init scaffold smoke test
        run: |
          termux-builder init smoketest --package com.example.smoke
          test -f smoketest/project.yml
          test -f smoketest/AndroidManifest.xml
          test -f smoketest/src/java/com/example/smoke/MainActivity.java

  android-sdk-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;35.0.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install .
      - name: Unit and signing integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Real KAPT processor integration
        run: >-
          python3 tests/integration/verify_kapt.py
          --android-jar "$ANDROID_HOME/platforms/android-34/android.jar"
          --d8 "$ANDROID_HOME/build-tools/35.0.0/d8"
          --dexdump "$ANDROID_HOME/build-tools/35.0.0/dexdump"
      - name: Real KSP processor integration
        run: python3 tests/integration/verify_ksp.py
      - name: Add Android build tools to PATH
        run: echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Build and inspect real APK and AAB artifacts
        run: |
          export ANDROID_SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          cd "$RUNNER_TEMP"
          termux-builder init termux-builder-e2e --package com.example.e2e
          project="$RUNNER_TEMP/termux-builder-e2e"
          python3 - "$project/project.yml" <<'PY'
          import sys
          import yaml

          project_path = sys.argv[1]
          with open(project_path, encoding="utf-8") as project_file:
              config = yaml.safe_load(project_file)
          config["android"]["min-sdk"] = 30
          config["dependencies"] = ["androidx.lifecycle:lifecycle-runtime:2.6.1"]
          with open(project_path, "w", encoding="utf-8") as project_file:
              yaml.safe_dump(config, project_file, sort_keys=False)
          PY
          python3 - "$project" <<'PY'
          import sys
          from pathlib import Path

          source = next(Path(sys.argv[1]).rglob("MainActivity.java"))
          source.write_text(source.read_text().replace("{", "{ static class DeletedMarker {}", 1))
          source.with_name("DeletedService.aidl").write_text(
              "package com.example.e2e; interface DeletedService { int value(); }"
          )
          PY
          termux-builder build "$project"
          python3 - "$project" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          project = Path(sys.argv[1])
          with zipfile.ZipFile(project / ".build/termux-builder-e2e-debug.apk") as apk:
              if b"DeletedMarker" not in apk.read("classes.dex"):
                  raise SystemExit("Initial APK is missing the regression fixture")
              if b"DeletedService" not in apk.read("classes.dex"):
                  raise SystemExit("Initial APK is missing compiled AIDL")
          source = next(project.rglob("MainActivity.java"))
          source.write_text(source.read_text().replace(" static class DeletedMarker {}", "", 1))
          source.with_name("DeletedService.aidl").unlink()
          PY
          termux-builder build "$project"
          termux-builder build "$project" --aab
          apk="$project/.build/termux-builder-e2e-debug.apk"
          aab="$project/.build/termux-builder-e2e-debug.aab"
          apks="$RUNNER_TEMP/termux-builder-e2e.apks"
          universal_apk="$RUNNER_TEMP/termux-builder-e2e-universal.apk"
          bundletool="$project/.cache/bundletool/bundletool-all-1.18.3.jar"
          test -s "$apk.idsig"
          apksigner verify --verbose -v4-signature-file "$apk.idsig" "$apk"
          umask 077
          password_file="$(mktemp)"
          printf '%s\n' android > "$password_file"
          trap 'rm -f "$password_file"' EXIT
          java -jar "$bundletool" build-apks --bundle="$aab" --output="$apks" --mode=universal --overwrite \
            --ks="$project/debug.keystore" --ks-key-alias=androiddebugkey \
            --ks-pass="file:$password_file" --key-pass="file:$password_file"
          python3 - "$apk" "$aab" "$apks" "$universal_apk" <<'PY'
          import os
          import sys
          import zipfile

          apk_path, aab_path, apks_path, universal_apk_path = sys.argv[1:]
          with zipfile.ZipFile(apk_path) as apk:
              if b"DeletedMarker" in apk.read("classes.dex"):
                  raise SystemExit("Rebuilt APK contains a deleted inner class")
              if b"DeletedService" in apk.read("classes.dex"):
                  raise SystemExit("Rebuilt APK contains a deleted AIDL interface")
              apk_dex = [name for name in apk.namelist() if name.endswith(".dex")]
              if "classes.dex" not in apk_dex or len(apk_dex) < 2:
                  raise SystemExit("APK is missing application or resolved library DEX")
          with zipfile.ZipFile(aab_path) as aab:
              if b"DeletedMarker" in aab.read("base/dex/classes.dex"):
                  raise SystemExit("Rebuilt AAB contains a deleted inner class")
              if b"DeletedService" in aab.read("base/dex/classes.dex"):
                  raise SystemExit("Rebuilt AAB contains a deleted AIDL interface")
              aab_names = set(aab.namelist())
              required = {
                  "BundleConfig.pb",
                  "base/manifest/AndroidManifest.xml",
                  "base/resources.pb",
                  "base/dex/classes.dex",
              }
              missing = sorted(required - aab_names)
              if missing:
                  raise SystemExit("AAB is missing: " + ", ".join(missing))
              aab_dex = [
                  name for name in aab_names
                  if name.startswith("base/dex/classes") and name.endswith(".dex")
              ]
              if len(aab_dex) < 2:
                  raise SystemExit("AAB is missing resolved library DEX")
          with zipfile.ZipFile(apks_path) as apks:
              if "universal.apk" not in apks.namelist():
                  raise SystemExit("bundletool APK set is missing universal.apk")
              with open(universal_apk_path, "wb") as universal_apk:
                  universal_apk.write(apks.read("universal.apk"))
          with zipfile.ZipFile(universal_apk_path) as universal_apk:
              if "classes.dex" not in universal_apk.namelist():
                  raise SystemExit("bundletool universal APK is missing classes.dex")
          for artifact in (apk_path, aab_path, apks_path, universal_apk_path):
              print(f"{artifact}: {os.path.getsize(artifact)} bytes")
          PY
          apksigner verify --verbose "$universal_apk"
